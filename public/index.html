<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status code explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <div class="header">
        <h1>StatusCode Explorer</h1>
        <p>Discover what HTTP status codes mean.</p>
        <p>Enter a status code and get a clear explanation</p>
    </div>
    <div class="search-box">
        <input type="number" id="input" placeholder="Enter status code (e.g 200,300,400)" />
        <button>Search</button>
    </div>
    <div class="result-box">
        <p>No data available</p>
    </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
